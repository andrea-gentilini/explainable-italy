name: Segnala un problema
description: Correggi un dato, un testo o un comportamento del sito
title: "[Problema] "
labels:
  - bug
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Dato
        - Fonte
        - Definizione
        - Traduzione
        - Interfaccia
        - Accessibilità
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Cosa hai osservato
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Fonte o passaggi per riprodurre
    validations:
      required: true

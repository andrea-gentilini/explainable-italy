name: Check historical views and exported links
on:
  push:
    branches: [fix/verified-data-and-dependencies]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_BASE_PATH: /explainable-italy
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.9.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - name: Inspect peer version declarations
        run: |
          pnpm peers check || true
          for pkg in eslint-plugin-import eslint-plugin-jsx-a11y eslint-plugin-react; do
            npm view "$pkg@latest" name version peerDependencies --json
          done
      - run: pnpm build
      - name: Check internal targets on every static page
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urljoin, urlsplit, unquote
          base = Path("out")
          prefix = "/explainable-italy/"
          class Links(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  props = dict(attrs)
                  if tag == "a" and props.get("href"):
                      targets.add(props["href"])
          checked = 0
          pages = sorted(base.rglob("*.html"))
          for page in pages:
              targets = set()
              Links().feed(page.read_text())
              rel = page.relative_to(base).as_posix().removesuffix("index.html")
              for target in targets:
                  url = urlsplit(urljoin("https://andrea-gentilini.github.io" + prefix + rel, target))
                  if url.hostname != "andrea-gentilini.github.io" or not url.path.startswith(prefix):
                      continue
                  path = base / unquote(url.path[len(prefix):])
                  assert path.is_file() or (path / "index.html").is_file(), (page, target)
                  checked += 1
          print(f"{len(pages)} pages, {checked} internal link targets checked")
          PY
      - name: Exercise year selection and source dates in both languages
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" --ignore-scripts --no-audit --no-fund playwright-core@1.56.1
          mkdir -p "$RUNNER_TEMP/site"
          ln -s "$PWD/out" "$RUNNER_TEMP/site/explainable-italy"
          python -m http.server 8172 --bind 127.0.0.1 --directory "$RUNNER_TEMP/site" > "$RUNNER_TEMP/server.log" 2>&1 &
          cd "$RUNNER_TEMP/browser"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright-core';
          const browser = await chromium.launch({channel:'chrome', headless:true});
          try {
            for (const lang of ['it','en']) {
              for (const zone of ['Pacific/Auckland','America/Los_Angeles']) {
                const page = await browser.newPage({timezoneId:zone});
                const root = 'http://127.0.0.1:8172/explainable-italy/' + (lang === 'en' ? 'en/' : '');
                await page.goto(root + 'data/spending-social-protection/?year=2000');
                const panel = page.locator('.old-age-definition .related-detail-value');
                await panel.filter({hasText: lang === 'it' ? 'Dato non disponibile' : 'Data unavailable'}).waitFor();
                assert.match(await panel.innerText(), /2000/);
                assert.match(await page.locator('.pension-boundary .related-detail-value').innerText(), /2000/);
                await page.locator('.year-selection select').selectOption('2001');
                await panel.filter({hasText:'2001'}).waitFor();
                assert.match(await panel.innerText(), /€/);
                await page.goto(root + 'data/unemployment-rate/source/');
                const snapshot = await (await page.request.get('http://127.0.0.1:8172/explainable-italy/data/raw/eurostat/une_rt_a.json')).json();
                const date = snapshot.updated.slice(0,10);
                const expected = new Intl.DateTimeFormat(lang === 'it' ? 'it-IT' : 'en-GB',{year:'numeric', month:'long', day:'numeric', timeZone:'UTC'}).format(new Date(date+'T00:00:00Z'));
                await page.locator('.source-selection-list').getByText(expected, {exact:true}).first().waitFor();
                console.log(lang, zone, 'historical values and official source date verified');
                await page.close();
              }
            }
          } finally { await browser.close(); }
          JS

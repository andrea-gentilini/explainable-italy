name: Controlli

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v7

      - name: Installa pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Installa Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Installa le dipendenze
        run: pnpm install --frozen-lockfile

      - name: Controlla stile e tipi
        run: pnpm lint

      - name: Verifica dati e build
        run: pnpm test

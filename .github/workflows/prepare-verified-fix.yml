name: Prepare reviewed dependency and data files
on:
  push:
    branches: [fix/verified-data-and-dependencies]
permissions:
  contents: write
jobs:
  regenerate:
    if: github.event.head_commit.message == 'Prepare verified dependency and editorial corrections'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.9.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: node scripts/update-data.mjs --offline
      - name: Commit reproducible outputs to the review branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -- data/processed/dashboard.json public/data/dashboard.json
          git diff --cached --stat
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m 'Rebuild bilingual exports from the reviewed catalogue'
          gh auth setup-git
          git push origin HEAD:refs/heads/fix/verified-data-and-dependencies
      - name: Audit the complete lockfile
        run: pnpm audit
